name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev,stream]"
      - run: pytest -q
      - run: python -m unittest discover -s tests -q
        working-directory: tracker
      - run: sma demo
