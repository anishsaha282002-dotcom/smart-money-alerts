# Publishes the static site in web/ to GitHub Pages (free).
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
#
# This publishes what is committed in web/, which is the labelled synthetic demo data. Once the
# scheduled scanner is switched on (SMS_SCAN_ENABLED = true), scan.yml publishes the site with live
# data instead and this workflow stands down, so the demo never overwrites the live record.
name: pages

on:
  push:
    branches: [main, smart-money-stories]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.SMS_SCAN_ENABLED != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
