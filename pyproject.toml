[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-money-alerts"
version = "0.1.0"
description = "Free, open-source, read-only memecoin smart-money alerts: plain-English wallet stories, wallet/caller/narrative grades, a 'can you still copy it' check, and a public hash-chained ledger."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]
keywords = ["solana", "bsc", "memecoin", "smart-money", "alerts", "four.meme", "on-chain"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]
stream = ["websockets>=12"]

[project.scripts]
sma = "sma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sma = ["fixtures/demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
